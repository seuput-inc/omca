# Manual Windows x64 packaging and native release checks. Never runs on push or PR.
name: Release (Windows x64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to, e.g. v0.5.0"
        type: string
        required: true

      publish:
        description: "Attach files to the release; disable for a pre-release build check"
        type: boolean
        default: true
permissions:
  contents: write

concurrency:
  group: release-windows-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Native update owner lifecycle
        shell: pwsh
        run: |
          cargo test --locked -p craft-anything-platform --lib update::tests::exited_owner_is_absent_not_an_update_failure -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Exited owner must not abort a prepared update' }
      - name: Real portable updater helper smoke
        shell: pwsh
        env:
          OMCA_UPDATE_SIGNING_KEY: ${{ secrets.OMCA_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p craft-anything-platform --example update_fixture
          if ($LASTEXITCODE -ne 0) { throw 'Updater fixture build failed' }
          $key = Join-Path $env:RUNNER_TEMP 'omca-update-smoke.pem'
          [IO.File]::WriteAllText($key, $env:OMCA_UPDATE_SIGNING_KEY)
          try {
            bun packaging/update-smoke.ts target/debug/examples/update_fixture.exe (Join-Path $env:RUNNER_TEMP 'omca-update-smoke') $key
            if ($LASTEXITCODE -ne 0) { throw 'Portable updater helper smoke failed' }
          } finally { Remove-Item -LiteralPath $key -Force }
      - name: Official Unity CLI private-profile boundary
        shell: pwsh
        run: |
          $store = Join-Path $env:RUNNER_TEMP ("omca-unity-private-" + [guid]::NewGuid().ToString())
          cargo run --locked -p craft-anything-engines --example unity_private_env -- "$store"
          if ($LASTEXITCODE -ne 0) { throw 'Official Unity CLI cannot isolate its Windows account profile' }
      - name: Native game-engine backend regressions
        shell: pwsh
        run: |
          cargo test --locked -p craft-anything-engines --lib game::
          if ($LASTEXITCODE -ne 0) { throw 'Native game-engine regression failed' }
      - name: Native image generation boundaries
        shell: pwsh
        run: |
          cargo test --locked -p craft-anything-engine --lib asset_tools::tests
          if ($LASTEXITCODE -ne 0) { throw 'Image provider permission or budget regression failed' }
          cargo test --locked -p craft-anything-ai --lib managed_image::tests
          if ($LASTEXITCODE -ne 0) { throw 'Native image decoding regression failed' }
      - name: Upstream security regressions
        shell: pwsh
        run: |
          cargo test --locked -p craft-anything-engine --lib -- interaction_tools::tests journal::tests settings::tests
          if ($LASTEXITCODE -ne 0) { throw 'Project containment or private settings regression failed' }
          cargo test --locked -p craft-anything-mcp --lib -- approval_tool_answers_in_the_permission_prompt_shape a_large_approval_keeps_its_decision
          if ($LASTEXITCODE -ne 0) { throw 'MCP approval response regression failed' }
      - name: Provider runtime regressions
        shell: pwsh
        working-directory: provider-runtime
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Provider runtime dependency installation failed' }
          bun test
          if ($LASTEXITCODE -ne 0) { throw 'Provider runtime regression failed' }
          bun run check
          if ($LASTEXITCODE -ne 0) { throw 'Provider runtime type check failed' }
      - name: Provider account runtime
        shell: bash
        run: |
          . packaging/env.sh
          build_provider_runtime bun-windows-x64
          echo "PROVIDER_RUNTIME_DIR=$(cygpath -w "$PROVIDER_RUNTIME_DIR")" >>"$GITHUB_ENV"
      - name: WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Korean fonts (craft-fonts, pinned in packaging/env.sh)
        shell: bash
        run: |
          . packaging/env.sh
          ensure_craft_fonts
          echo "CRAFT_FONTS_DIR=$(cygpath -w "$CRAFT_FONTS_DIR")" >>"$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >>"$GITHUB_ENV"
      - name: cargo-about (the third-party licence bundle)
        run: cargo install cargo-about --locked --features cli
      - name: Licences (packaging/env.sh stage_licences)
        shell: bash
        run: |
          . packaging/env.sh
          CRAFT_FONTS_DIR="$(cygpath -u "$CRAFT_FONTS_DIR")" PROVIDER_RUNTIME_DIR="$(cygpath -u "$PROVIDER_RUNTIME_DIR")" stage_licences "$CARGO_TARGET_DIR/licences"
          echo "LICENCES_DIR=$(cygpath -w "$CARGO_TARGET_DIR/licences")" >>"$GITHUB_ENV"
      - name: Package
        shell: pwsh
        env:
          OMCA_UPDATE_SIGNING_KEY: ${{ secrets.OMCA_UPDATE_SIGNING_KEY }}
        run: pwsh packaging/windows/package.ps1
      - name: Verify installed MSI and portable payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem dist/release/*.msi).FullName
          $log = Join-Path $env:RUNNER_TEMP 'omca-install.log'
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content $log -Tail 80
            throw "MSI installation failed: $($install.ExitCode)"
          }
          $zip = Get-Item dist/release/*-portable.zip
          $expanded = Join-Path $env:RUNNER_TEMP 'omca-portable'
          Expand-Archive $zip.FullName $expanded
          $roots = @((Join-Path $env:ProgramFiles 'OMCA'), (Join-Path $expanded $zip.BaseName))
          foreach ($root in $roots) {
            & (Join-Path $root 'craft-anything-cli.exe') --version | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Installed CLI failed: $root" }
            bun provider-runtime/smoke.ts (Join-Path $root 'omca-provider-runtime.exe') (Join-Path $env:RUNNER_TEMP 'omca-installed-provider-smoke')
            if ($LASTEXITCODE -ne 0) { throw "Installed provider runtime failed: $root" }
          }
      - name: Native updater and titlebar regressions
        shell: pwsh
        run: |
          $env:OMCA_UPDATE_TEST_MSI = (Get-ChildItem dist/release/*.msi).FullName
          cargo test -p craft-anything-platform update::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native updater regression failed' }
          cargo test -p craft-anything-ui-egui updates::tests
          if ($LASTEXITCODE -ne 0) { throw 'Updater UI regression failed' }
          cargo test -p craft-anything-ui-egui titlebar::tests
          if ($LASTEXITCODE -ne 0) { throw 'Titlebar regression failed' }
      - name: Native game-engine regressions
        shell: pwsh
        run: |
          cargo test -p craft-anything-engine --lib setup_tools::tests
          if ($LASTEXITCODE -ne 0) { throw 'Engine setup authorization regression failed' }
          cargo test -p craft-anything-ui-egui --lib engine_ui::tests
          if ($LASTEXITCODE -ne 0) { throw 'Engine setup UI regression failed' }
      - name: Unified workspace regressions
        shell: pwsh
        run: |
          cargo test --locked -p craft-anything-ui-egui --lib -- provider_connect::tests settings_ui::tests::picture_model
          if ($LASTEXITCODE -ne 0) { throw 'Model selection regression failed' }
          cargo test --locked -p craft-anything-ui-egui --test smoke -- legacy_preferences_share_navigation project_result_shows_the_check_capture_without_a_similarity_score
          if ($LASTEXITCODE -ne 0) { throw 'Unified workspace regression failed' }
      - name: Attach to the release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" (Get-ChildItem dist/release/*.msi, dist/release/*.zip, dist/release/*.manifest.json, dist/release/*.sig).FullName --clobber
      - name: Keep pre-release build artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: omca-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
            dist/release/*.manifest.json
            dist/release/*.sig
          if-no-files-found: error
